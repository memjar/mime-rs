[package]
name = "mime-rs"
description = "MIME message parser, validator, editor and builder library"
version = "0.0.1"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "parser-implementations", "encoding", "no-std"]
keywords = ["email", "mime", "rfc5322", "parser", "builder"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/mime-rs/latest/mime"
repository = "https://github.com/pimalaya/mime"
exclude = ["/tests/corpus", "/tests/vectors", "/fuzz"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["parser", "base64", "encoding"]
parser = ["dep:memchr"]
base64 = ["dep:base64"]
encoding = ["dep:encoding_rs"]

[lib]
name = "mime"

[[example]]
name = "parse_and_read"
path = "examples/parse_and_read.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "forgiving_parse"
path = "examples/forgiving_parse.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "body_lists"
path = "examples/body_lists.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "content_encodings"
path = "examples/content_encodings.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "reply_and_forward"
path = "examples/reply_and_forward.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "edit_a_draft"
path = "examples/edit_a_draft.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "submission"
path = "examples/submission.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "validate_errors"
path = "examples/validate_errors.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "headers_only"
path = "examples/headers_only.rs"
required-features = ["parser", "base64", "encoding"]

[[example]]
name = "strict_builder"
path = "examples/strict_builder.rs"

[[example]]
name = "raw_builder"
path = "examples/raw_builder.rs"

[[bench]]
name = "compare"
path = "benches/compare.rs"
harness = false
required-features = ["parser", "base64", "encoding"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
mail-builder = { version = "1", default-features = false }
mail-parser = { version = "1", default-features = false, features = ["full_encoding", "serde"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"], optional = true }
memchr = { version = "2", default-features = false, optional = true }
