[package]
name = "mime-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mail-parser = { version = "=1.0.0", default-features = false, features = ["full_encoding", "serde"] }
mime-rs = { path = "..", features = ["parser", "base64", "encoding"] }
serde_json = "1"
simd-cpu = { version = "0.1", features = ["std"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer"
path = "fuzz_targets/answer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fields"
path = "fuzz_targets/fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write"
path = "fuzz_targets/write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit"
path = "fuzz_targets/edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

# Detach from the parent package so `cargo fuzz` builds this crate standalone.
[workspace]
